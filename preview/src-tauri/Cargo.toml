[package]
name = "achievement-watcher-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "achievement_watcher_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aw-core = { path = "../crates/aw-core" }
base64 = "0.22.1"
chrono = "0.4.45"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize"] }
tauri = { version = "2.11.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-global-shortcut = "2.3.2"
ureq = { version = "2.12.1", default-features = false, features = ["json", "tls"] }
obws = "0.15.0"
tokio = { version = "1.49.0", features = ["time"] }
tungstenite = "0.28.0"
walkdir = "2.5.0"
semver = "1.0.28"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_XboxController",
]

[target.'cfg(windows)'.dependencies]
xcap = "0.9.8"
winreg = "0.56.0"
